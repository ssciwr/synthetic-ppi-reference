[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthetic_ppi"
version = "0.1.0"
description = "BioCypher project for the Synthetic Protein Interaction Dataset"
readme = "README.md"
authors = [
    {name = "BioCypher User", email = "user@example.com"},
]
requires-python = ">=3.13"
dependencies = [
    "biocypher>=0.17.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.32.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pyarrow>=26.0.0",
]
[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "isort",
    "mypy",
]

[project.urls]
"Homepage" = "https://github.com/biocypher-user/synthetic_ppi"
"Bug Tracker" = "https://github.com/biocypher-user/synthetic_ppi/issues"
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
