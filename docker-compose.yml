services:
  # BioCypher pipeline service
  synthetic_ppi:
    build: .
    container_name: synthetic_ppi-pipeline
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/biocypher-log
      - ./output:/app/biocypher-out
    environment:
      - BIOCYPHER_CONFIG_PATH=config/biocypher_config.docker.yaml
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - biocypher-network

  # Neo4j database service
  neo4j:
    image: neo4j:5.15-community
    container_name: synthetic_ppi-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 30
    networks:
      - biocypher-network

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:

networks:
  biocypher-network:
    driver: bridge
