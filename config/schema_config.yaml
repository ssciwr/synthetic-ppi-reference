# Schema configuration for the Synthetic Protein Interaction Dataset.
# Both classes exist in the Biolink 3.2.1 head ontology (config/biocypher_config.yaml).

protein:
  represented_as: node
  input_label: protein
  properties:
    genesymbol: str
    ncbi_tax_id: int

pairwise molecular interaction:
  represented_as: edge
  input_label: protein_protein_interaction
  source: protein
  target: protein
  properties:
    type: str
    is_directed: bool
    is_stimulation: bool
    is_inhibition: bool
    consensus_direction: bool
    consensus_stimulation: bool
    consensus_inhibition: bool
